name: Offline allocation and provenance checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify the committed report pack
        run: python main.py --verify-only
      - run: python -m pytest -q
      - run: python main.py --data-mode synthetic --end 2026-05-31
      - run: python main.py --verify-only
